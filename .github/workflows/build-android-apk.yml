name: Build Android APK (EAS)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - "claude/personal-finance-app-expo-*"
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo token
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Secret EXPO_TOKEN non impostato. Crea un access token su https://expo.dev/settings/access-tokens e aggiungilo come repository secret EXPO_TOKEN."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Link/create EAS project
        run: eas init --non-interactive || eas project:init --non-interactive || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Persist EAS project id (if newly created)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app.json; then
            git add app.json
            git commit -m "chore: persist EAS project id [skip ci]"
            git push
          else
            echo "app.json invariato, nessun projectId da salvare."
          fi

      # Build in locale sul runner (non sui server cloud di EAS): non consuma
      # la quota mensile di build cloud del piano Free, solo più lento sulla
      # prima esecuzione (poi la cache Gradle velocizza le successive).
      # timeout-minutes forza un fallimento con log leggibili invece di un
      # blocco senza errore se qualcosa si impunta (già successo due volte).
      - name: Build APK locally via EAS CLI
        timeout-minutes: 25
        run: eas build --platform android --profile preview --local --non-interactive --output ./risparmio-buffett.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_DEBUG: "1"

      - name: Verify APK exists
        run: |
          if [ ! -f risparmio-buffett.apk ]; then
            echo "::error::APK non trovato dopo la build locale."
            exit 1
          fi
          ls -lh risparmio-buffett.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: risparmio-buffett-apk
          path: mobile-app/risparmio-buffett.apk
          retention-days: 30
