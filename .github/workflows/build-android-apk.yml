name: Build Android APK (EAS)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - "claude/personal-finance-app-expo-*"
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Niente step "Setup Android SDK": i runner ubuntu-latest hanno già un
      # Android SDK completo preinstallato in /usr/local/lib/android/sdk (con
      # ANDROID_HOME/ANDROID_SDK_ROOT già impostati e licenze già accettate).
      # L'azione android-actions/setup-android@v3 tentava di installare in più
      # il pacchetto legacy "tools", che Google ha rimosso dal repository:
      # questo la fa fallire con "Failed to find package 'tools'" pur non
      # servendo a nulla per la build (Gradle/EAS scaricano da soli qualsiasi
      # platform/build-tools specifico manchi).

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # eas build --local invoca Gradle, che scarica da solo l'NDK "side by
      # side" richiesto dal progetto (27.1.12297006) se non già presente sul
      # runner. Quel download-durante-la-build a volte arriva troncato/corrotto
      # ("Archive is not a ZIP archive") e fa fallire tutta la build dopo ~2
      # minuti di compilazione nativa già fatta. Installandolo qui, in un passo
      # dedicato con retry, l'eventuale corruzione si ripresenta subito (pochi
      # secondi) invece che dopo aver buttato via il lavoro di Gradle.
      - name: Ensure required Android NDK is installed
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_PKG="ndk;27.1.12297006"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
            if "$SDKMANAGER" --install "$NDK_PKG"; then
              break
            fi
            echo "::warning::sdkmanager install di $NDK_PKG fallito (tentativo $attempt), riprovo..."
            sleep 10
          done
          test -d "$ANDROID_HOME/ndk/27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo token
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Secret EXPO_TOKEN non impostato. Crea un access token su https://expo.dev/settings/access-tokens e aggiungilo come repository secret EXPO_TOKEN."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Link/create EAS project
        run: eas init --non-interactive || eas project:init --non-interactive || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Persist EAS project id (if newly created)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app.json; then
            git add app.json
            git commit -m "chore: persist EAS project id [skip ci]"
            git push
          else
            echo "app.json invariato, nessun projectId da salvare."
          fi

      # Incorpora commit e orario reali nell'APK (schermata Impostazioni):
      # senza questo, quando un fix "non sembra funzionare" non c'è modo di
      # verificare dal telefono se il problema è che il fix è sbagliato o che
      # il telefono sta ancora usando un APK installato prima del fix.
      - name: Write build info
        run: |
          cat > src/constants/buildInfo.js <<EOF
          export const BUILD_COMMIT = '${GITHUB_SHA::7}';
          export const BUILD_TIME = '$(date -u +"%Y-%m-%d %H:%M UTC")';
          EOF
          cat src/constants/buildInfo.js

      # Build in locale sul runner (non sui server cloud di EAS): non consuma
      # la quota mensile di build cloud del piano Free, solo più lento sulla
      # prima esecuzione (poi la cache Gradle velocizza le successive).
      # timeout-minutes forza un fallimento con log leggibili invece di un
      # blocco senza errore se qualcosa si impunta (già successo due volte).
      - name: Build APK locally via EAS CLI
        timeout-minutes: 25
        run: eas build --platform android --profile preview --local --non-interactive --output ./risparmio-buffett.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_DEBUG: "1"

      - name: Verify APK exists
        run: |
          if [ ! -f risparmio-buffett.apk ]; then
            echo "::error::APK non trovato dopo la build locale."
            exit 1
          fi
          ls -lh risparmio-buffett.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: risparmio-buffett-apk
          path: mobile-app/risparmio-buffett.apk
          retention-days: 30
