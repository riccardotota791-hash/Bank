name: Publish EAS Update (Expo Go, free)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - "claude/personal-finance-app-expo-*"
    paths:
      - "mobile-app/**"
      - ".github/workflows/publish-eas-update.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo token
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Secret EXPO_TOKEN non impostato. Vedi README per come crearlo."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project
        run: eas init --non-interactive || eas project:init --non-interactive || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: eas update --branch preview --message "Aggiornamento automatico ${{ github.sha }}" --non-interactive --json > eas-update-result.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Show update result (debug)
        if: always()
        run: cat eas-update-result.json || true

      - name: Print shareable Expo Go link
        run: |
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
            const raw = fs.readFileSync('eas-update-result.json', 'utf8');
            const data = JSON.parse(raw);
            const list = Array.isArray(data) ? data : [data];
            const first = list[0] || {};
            const groupId = first.group || '';
            const runtimeVersion = first.runtimeVersion || appJson.version;
            const slug = appJson.slug;
            const projectId = appJson.extra.eas.projectId;
            const link = 'https://expo.dev/preview/update?message=&updateRuntimeVersion=' + encodeURIComponent(runtimeVersion) + '&slug=' + encodeURIComponent(slug) + '&projectId=' + projectId + '&group=' + groupId;
            console.log('');
            console.log('=================================================');
            console.log('Apri questo link sul telefono (apre Expo Go automaticamente):');
            console.log(link);
            console.log('=================================================');
            console.log('');
            console.log(JSON.stringify(list, null, 2));
          "
