<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RickFinance</title>

  <!-- Icona Browser e App -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Manifest e PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <style>
    :root {
      --bg-dark: #0b1329;
      --card-bg: #111c3a;
      --accent-blue: #00a8ff;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --green: #00e676;
      --red: #ff5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .btn-add {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Grid KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .card-value.green { color: var(--green); }
    .card-value.red { color: var(--red); }

    /* Sezione Tabelle e Movimenti */
    .transactions {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Regole Responsive Mobile */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .btn-add {
        width: 100%;
      }
      .kpi-grid {
        grid-template-columns: 1fr;
      }
      th, td {
        padding: 10px 8px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Panoramica Finanziaria</h1>
      <button class="btn-add">+ Nuova Transazione</button>
    </header>

    <div class="kpi-grid">
      <div class="card">
        <div class="card-title">Netto Iniziale</div>
        <div class="card-value">€ 0,00</div>
      </div>
      <div class="card">
        <div class="card-title">Entrate Totali</div>
        <div class="card-value green">€ 4.400,00</div>
      </div>
      <div class="card">
        <div class="card-title">Uscite Totali</div>
        <div class="card-value red">€ 1.590,00</div>
      </div>
      <div class="card">
        <div class="card-title">Risparmio Mese</div>
        <div class="card-value green">54.5%</div>
      </div>
    </div>

    <div class="transactions">
      <div class="card-title" style="margin-bottom: 16px;">Ultimi Movimenti</div>
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Descrizione</th>
            <th>Categoria</th>
            <th>Importo</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>15/08/2026</td>
            <td>Stipendio</td>
            <td>Entrate</td>
            <td class="green">+ € 2.200,00</td>
          </tr>
          <tr>
            <td>12/08/2026</td>
            <td>Spesa Supermercato</td>
            <td>Alimentari</td>
            <td class="red">- € 85,00</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="sw.js"></script>
</body>
</html>
